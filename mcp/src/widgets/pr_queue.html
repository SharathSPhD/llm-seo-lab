<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PR Queue</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 12px; background: #fafafa; color: #111; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 6px 8px; border-bottom: 1px solid #eee; text-align: left; font-size: 12px; }
    .open { color: #1d4ed8; font-weight: 600; }
    .merged { color: #047857; font-weight: 600; }
    .closed_unmerged { color: #b91c1c; font-weight: 600; }
    .stale { background: #fef3c7; }
  </style>
</head>
<body>
  <h2>PR Queue</h2>
  <table id="t"><thead><tr><th>#</th><th>Branch</th><th>State</th><th>Age</th><th>Brief</th></tr></thead><tbody></tbody></table>
  <script>
    const prs = window.LLM_SEO_LAB?.prs ?? [];
    const tb = document.querySelector("#t tbody");
    for (const p of prs) {
      const tr = document.createElement("tr");
      if (p.state === "open" && p.age_days >= 14) tr.className = "stale";
      tr.innerHTML = `<td><a href="${p.pr_url}" target="_blank">#${p.pr_number}</a></td><td>${p.branch}</td><td class="${p.state}">${p.state}</td><td>${p.age_days}d</td><td>${p.brief_id}</td>`;
      tb.appendChild(tr);
    }
  </script>
</body>
</html>
