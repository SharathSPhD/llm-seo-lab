<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Site Picker</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 12px; background: #fafafa; color: #111; }
    h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
    select { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ddd; }
    button { margin-top: 8px; padding: 6px 12px; background: #111; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Pick a site</h2>
  <select id="site"></select>
  <button onclick="pick()">Use site</button>
  <script>
    const sites = window.LLM_SEO_LAB?.sites ?? [];
    const sel = document.getElementById("site");
    for (const s of sites) {
      const o = document.createElement("option");
      o.value = s.site_id; o.textContent = s.site_url; sel.appendChild(o);
    }
    function pick() {
      window.parent?.postMessage({ type: "llm-seo-lab/site-picker/select", site_id: sel.value }, "*");
    }
  </script>
</body>
</html>
