name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  ts-typecheck-test:
    name: TypeScript typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - run: npm ci
      - run: npm run lint --silent
      - run: npm run typecheck --silent
      - run: npm run test --silent
      - name: MCP HTTP integration tripwire
        run: node --experimental-strip-types --test mcp/tests/integration.http.test.ts
      - name: cli-worker loop schema tripwire
        run: node --experimental-strip-types --test packages/cli-worker/src/runners/loop.test.ts
      - name: Install uv (for pratyaksha integration test)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Pratyakṣa witness + sublation integration tripwire
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          node --experimental-strip-types --test mcp/tests/pratyaksha.integration.test.ts
      - run: npm run smoke --silent

  python-lint:
    name: Python ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Ruff lint
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uvx ruff check .

  skill-harnesses:
    name: Skill harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Run all skill harnesses
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash skills/run-all-tests.sh

  benchmarks:
    name: Phase 6 benchmark suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run statistical analysis + question-bank + runner tests
        run: python -m unittest discover -s benchmarks -p '*_test.py' -v
      - name: Smoke-run the harness end-to-end (renders results.md)
        run: python -m benchmarks.runner.cli --output-dir benchmarks/runs/ci
      - name: Verify results.md is non-empty and headline-significant
        run: |
          test -s benchmarks/runs/ci/results.md
          grep -q "Per-engine headline contrast" benchmarks/runs/ci/results.md
          grep -q "Bonferroni-corrected significance" benchmarks/runs/ci/results.md
