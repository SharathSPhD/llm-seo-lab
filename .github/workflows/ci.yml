name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-lint:
    name: Docs link & markdown sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify docs/ structure exists
        run: |
          for d in research triz spec prd plans benchmarks use-cases whitepaper; do
            test -d "docs/$d" || (echo "Missing docs/$d" && exit 1)
          done
      - name: Verify foundational research is present
        run: test -f docs/research/seo_research_1.md
